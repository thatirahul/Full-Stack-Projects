_schema-version: 3.3.0
ID: uploadexcel
description: A simple CAP project.
version: 1.0.0
modules:
  - name: uploadexcel-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: uploadexcel-auth
      - name: uploadexcel-destination
      - name: uploadexcel-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: uploadexcel-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: uploadexcel-auth
      - name: srv-api
      - name: uploadexcel-html5-repo-host
        parameters:
          config:
            HTML5Runtime_enabled: true
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - project1.zip
          name: uploadexcelproject1
          target-path: app/
  - name: uploadexcelproject1
    type: html5
    path: app/project1
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: uploadexcel-destination-content
    type: com.sap.application.content
    requires:
      - name: uploadexcel-destination
        parameters:
          content-target: true
      - name: uploadexcel-html5-repo-host
        parameters:
          service-key:
            name: uploadexcel-html5-repo-host-key
      - name: uploadexcel-auth
        parameters:
          service-key:
            name: uploadexcel-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: uploadexcel_html_repo_host
              ServiceInstanceName: uploadexcel-html5-service
              ServiceKeyName: uploadexcel-html5-repo-host-key
              sap.cloud.service: uploadexcel
            - Authentication: OAuth2UserTokenExchange
              Name: uploadexcel_uaa
              ServiceInstanceName: uploadexcel-xsuaa-service
              ServiceKeyName: uploadexcel-auth-key
              sap.cloud.service: uploadexcel
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  - name: uploadexcel-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: uploadexcel-db
resources:
  - name: uploadexcel-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
        tenant-mode: dedicated
        xsappname: uploadexcel-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-name: uploadexcel-xsuaa-service
      service-plan: application
  - name: uploadexcel-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
  - name: uploadexcel-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: uploadexcel-html5-service
      service-plan: app-host
  - name: uploadexcel-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
