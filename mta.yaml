_schema-version: 3.3.0
ID: document-ai-test
description: A simple CAP project.
version: 1.0.0

modules:
  - name: document-ai-test-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: document-ai-test-auth
      - name: document-ai-test-destination
      - name: document-ai-test-db
      - name: document-ai-test-docai        # <-- Added
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: document-ai-test-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: document-ai-test-auth
      - name: srv-api
      - name: document-ai-test-html5-repo-host
        parameters:
          config:
            HTML5Runtime_enabled: true
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - project1.zip
          name: documentaitestproject1
          target-path: app/

  - name: documentaitestproject1
    type: html5
    path: app/project1
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: document-ai-test-destination-content
    type: com.sap.application.content
    requires:
      - name: document-ai-test-destination
        parameters:
          content-target: true
      - name: document-ai-test-html5-repo-host
        parameters:
          service-key:
            name: document-ai-test-html5-repo-host-key
      - name: document-ai-test-auth
        parameters:
          service-key:
            name: document-ai-test-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: document-ai-test_html_repo_host
              ServiceInstanceName: document-ai-test-html5-service
              ServiceKeyName: document-ai-test-html5-repo-host-key
              sap.cloud.service: document-ai-test

            - Name: document-ai-test_uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: document-ai-test-xsuaa-service
              ServiceKeyName: document-ai-test-auth-key
              sap.cloud.service: document-ai-test

          existing_destinations_policy: update
    build-parameters:
      no-source: true

  - name: document-ai-test-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: document-ai-test-db

resources:
  - name: document-ai-test-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: document-ai-test-xsuaa-service
      path: ./xs-security.json
      config:
        tenant-mode: dedicated
        xsappname: document-ai-test-${org}-${space}
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

  - name: document-ai-test-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ui5
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication

              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true

            existing_destinations_policy: update
    requires:
      - name: srv-api

  - name: document-ai-test-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: document-ai-test-html5-service

  - name: document-ai-test-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # Existing Document AI service
  - name: document-ai-test-docai
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: DOC-AI

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production